# markeijbaard.nl — nginx-configuratie binnen de container
#
# Dit bestand komt terecht in /etc/nginx/conf.d/default.conf en draait dus
# binnen het http-blok van de standaardconfiguratie van het nginx-image.
#
# TLS, HSTS en het echte bezoekersadres komen van Nginx Proxy Manager; deze
# container luistert alleen op poort 80 binnen het proxy-network en is niet
# rechtstreeks vanaf internet bereikbaar.

# Het adres van de bezoeker zit in X-Real-IP, gezet door NPM. Zonder deze
# regels staat in elke logregel het interne adres van de proxycontainer.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Real-IP;

# Cache-Control per pad, in één map in plaats van losse add_header-regels per
# location. Dat voorkomt de bekende nginx-valkuil dat een add_header in een
# location alle add_headers van het serverblok overschrijft.
#
# Let op: dit wijkt bewust af van _headers.txt. Daar staat voor /assets/* een
# jaar met 'immutable', maar Minimal Mistakes zet geen contentversie in de
# bestandsnamen (main.css blijft main.css). Met 'immutable' zou een terugkerende
# bezoeker na een restyling een jaar lang de oude stylesheet houden. Vandaar een
# week voor css/js en een maand voor afbeeldingen en lettertypen.
map $uri $site_cache {
    default                 "public, max-age=0, must-revalidate";
    ~^/assets/(css|js)/     "public, max-age=604800";
    ~^/assets/              "public, max-age=2592000";
}

gzip              on;
gzip_vary         on;
gzip_min_length   1024;
gzip_proxied      any;
gzip_comp_level   6;
gzip_types        text/plain text/css text/xml application/xml application/xml+rss
                  application/atom+xml application/javascript application/json
                  image/svg+xml application/manifest+json;

# www gaat naar het kale domein, net zoals GitHub Pages dat deed.
server {
    listen 80;
    server_name www.markeijbaard.nl;
    return 301 https://markeijbaard.nl$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # NPM beëindigt TLS en stuurt door op http. Zonder deze twee regels bouwt
    # nginx bij een mapredirect een absolute URL met zijn eigen containernaam
    # erin, en belandt de bezoeker op http://markeijbaard-site/over/.
    absolute_redirect off;
    port_in_redirect  off;

    add_header Cache-Control       $site_cache                      always;
    add_header X-Content-Type-Options nosniff                       always;
    add_header X-Frame-Options     SAMEORIGIN                       always;
    add_header Referrer-Policy     strict-origin-when-cross-origin  always;
    add_header Permissions-Policy  "geolocation=(), microphone=(), camera=()" always;

    # Voor Uptime Kuma. Staat los van de site, zodat een controle elke minuut
    # niet in de bezoekersstatistieken of het toegangslogboek terechtkomt.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Jekyll schrijft mappen met een index.html (/over/index.html) plus één los
    # bestand: /404.html. De volgorde hieronder is hoe GitHub Pages het ook
    # oplost — /over werkt en stuurt door naar /over/.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Verborgen bestanden nooit uitleveren. In _site hoort niets te staan wat
    # met een punt begint, maar dit kost niets en scheelt een verrassing.
    # .well-known blijft er bewust buiten: daar loopt de certificaatcontrole
    # van Let's Encrypt overheen.
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# .github/workflows/build-jekyll.yml
#
# De site wordt één keer gebouwd en naar twee plekken gepubliceerd:
#
#   1. GitHub Pages  — het huidige adres, blijft draaien tot de overstap rond is
#   2. GHCR          — ghcr.io/meijbaard/markeijbaard-nl, het image dat de
#                      homeserver draait
#
# De twee publicatiejobs staan bewust los van elkaar en hangen allebei alleen
# aan 'build'. Gaat het duwen van het image mis, dan is de run rood en zie je
# dat, maar de site op Pages wordt gewoon bijgewerkt — en andersom.
#
# Na de DNS-overstap naar de homeserver kunnen de job 'pages' en de stap
# 'Artefact voor Pages' weg. Zolang beide draaien is terugvallen op Pages één
# DNS-wijziging.
name: Build & Deploy Jekyll

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-newsdashboard]   # herbouw na elke nieuwsupdate

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'     # stabiel voor Jekyll/Pages
          bundler-cache: false    # geen cache; voorkomt problemen bij Ruby patch-updates

      - name: Install dependencies
        run: bundle install

      - name: Schrijf build-secrets naar _data
        env:
          N8N_WEBHOOK_URL: ${{ secrets.n8n_webhook_url }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "::error::Secret n8n_webhook_url ontbreekt; het contactformulier zou zonder werkende actie live gaan."
            exit 1
          fi
          printf 'n8n_webhook_url: "%s"\n' "$N8N_WEBHOOK_URL" > _data/secrets.yml

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Artefact voor Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Artefact voor het container-image
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./_site
          retention-days: 1
          if-no-files-found: error

  # --- publicatiedoel 1: GitHub Pages ---------------------------------------
  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # --- publicatiedoel 2: image voor de homeserver ---------------------------
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Nodig voor de Dockerfile en docker/nginx.conf; de gebouwde site komt
        # uit het artefact hieronder, die wordt hier niet opnieuw gebouwd.

      - name: Gebouwde site ophalen
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ./_site

      - name: Inloggen bij GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagenaam en tags bepalen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/meijbaard/markeijbaard-nl
          # 'main' is de tag die de server volgt; 'sha-<commit>' blijft staan en
          # is waar je op terugvalt als een publicatie stukgaat.
          tags: |
            type=raw,value=main
            type=sha

      - name: Image bouwen en publiceren
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Meld welk image er klaarstaat
        run: |
          {
            echo "### Image gepubliceerd"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "De homeserver pakt de tag \`main\` binnen tien minuten op."
          } >> "$GITHUB_STEP_SUMMARY"
